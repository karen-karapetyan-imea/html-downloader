[project]
name = "artist-etl"
version = "0.1.0"
description = "Raw marketplace artist HTML pages -> unified artist Parquet dataset"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.12",
    "duckdb>=1.1",
    "lxml>=5.0",
    "pyarrow>=17.0",
    "pycountry>=24.6",
]

[project.scripts]
artist-etl = "artists.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["artists"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["artfinder_etl", "artmajeur_etl", "artsper-etl", "artsy_etl", "saatchi_etl", "__MACOSX"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
